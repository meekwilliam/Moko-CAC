<svg width="117" height="51" viewBox="0 0 117 51" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- White rounded face: bright top → light grey bottom -->
    <linearGradient id="boneFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3EE"/>
    </linearGradient>
    <!-- Broad top-edge gloss -->
    <linearGradient id="boneGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>

    <!-- The dog-bone silhouette: thin middle bar + four knobbed ends -->
    <g id="bone">
      <rect x="9.5" y="13.5" width="98" height="16" rx="5"/>
      <ellipse cx="9.5" cy="11" rx="9.5" ry="11"/>
      <ellipse cx="9.5" cy="31" rx="9.5" ry="11"/>
      <ellipse cx="107.5" cy="12" rx="9.5" ry="11"/>
      <ellipse cx="107.5" cy="32" rx="9.5" ry="11"/>
    </g>

    <!-- Clip so the shine stays inside the bone -->
    <clipPath id="boneClip"><use href="#bone"/></clipPath>
  </defs>

  <!-- Base slab (3D underside) -->
  <use href="#bone" fill="#B7C0CE" transform="translate(0, 8)"/>
  <!-- White top face -->
  <use href="#bone" fill="url(#boneFace)"/>
  <!-- Crisp edge -->
  <use href="#bone" fill="none" stroke="#AEB8C6" stroke-width="1"/>
  <!-- Top-edge gloss, inset slightly -->
  <use href="#bone" fill="url(#boneGloss)" transform="translate(5.85, 2) scale(0.9, 0.5)"/>

  <!-- Diagonal shine streak, clipped to the bone -->
  <g clip-path="url(#boneClip)">
    <rect x="11.7" y="5.1" width="35.1" height="15.3" rx="7"
          fill="#ffffff" fill-opacity="0.75" filter="url(#shineBlur)"/>
  </g>
</svg>

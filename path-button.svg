<svg width="200" height="210" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="face" cx="40%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#8FD84F"/>
      <stop offset="55%" stop-color="#79C93F"/>
      <stop offset="100%" stop-color="#5EAD2C"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#519F2C"/>
      <stop offset="100%" stop-color="#3A7C20"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- 3D side (dark base, offset down) -->
  <ellipse cx="100" cy="118" rx="74" ry="58" fill="url(#side)"/>

  <!-- top face -->
  <ellipse cx="100" cy="98" rx="74" ry="58" fill="url(#face)"/>

  <!-- soft bottom shading on the face for a puffed, rounded look -->
  <ellipse cx="102" cy="130" rx="54" ry="20" fill="#3A7C20" opacity="0.28" filter="url(#soft)"/>

  <!-- broad soft sheen (upper-left) -->
  <ellipse cx="74" cy="72" rx="36" ry="17" fill="#FFFFFF" opacity="0.30"
           transform="rotate(-22 74 72)" filter="url(#soft)"/>

  <!-- crisp glossy rim-light arc along the top-left edge -->
  <path d="M34,82 A70,54 0 0 1 92,44" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>

  <!-- star -->
  <path d="M100,65 L107.4,84.8 L128.5,85.7 L112,98.9 L117.6,119.3 L100,107.6 L82.4,119.3 L88,98.9 L71.5,85.7 L92.6,84.8 Z"
        fill="#FFFFFF"/>
</svg>
